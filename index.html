<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=star,share,search,notifications,settings,person,draft,view_kanban,menu,more_vert,add" />
    <link rel="stylesheet" href="css/style.css" />

  </head>
  <body>
    <header id="head">
      <button id="menu-btn" class="icon-btn" type="button"
        aria-label="Open menu" aria-controls="nav-bar" aria-expanded="false">
        <span class="icon light material-symbols-outlined" aria-hidden="true">
          menu
        </span>
      </button>
      <h1 class="app-name"><a href="/">Kanban</a></h1>
      <div class="search-container">
        <button id="search-btn" class="icon-btn" type="button"
          aria-label="Search">
          <span class="icon light material-symbols-outlined"
            aria-hidden="true">search</span>
        </button>
        <input id="search-bar" type="search"
          aria-label="Search tasks"
          placeholder="Try searching tasks" />
      </div>
      <div class="head-buttons-group">
        <button id="share-btn" class="share-container" type="button">
          <span class="icon dark material-symbols-outlined"
            aria-hidden="true">share</span>
          <p>Share</p>
        </button>
        <button id="config-btn" class="icon-btn round" type="button"
          aria-label="Settings"><span
            class="icon light material-symbols-outlined"
            aria-hidden="true">settings</span></button>
        <button id="notifications-btn" class="icon-btn round"
          type="button" aria-label="Notifications"><span
            class="icon light material-symbols-outlined"
            aria-hidden="true">notifications</span></button>
        <button id="account-btn" class="icon-btn round" type="button"
          aria-label="My account">
          <span class="icon light material-symbols-outlined" aria-hidden="true">
            person
          </span>
        </button>
      </div>
    </header>

    <div id="sidebar-backdrop" aria-hidden="true"></div>

    <nav id="nav-bar" aria-label="Main navigation">
      <div class="nav-container">
        <label class="nav-items" for="nav-board-btn" tabindex="0">
          <span class="icon light material-symbols-outlined" aria-hidden="true">
            view_kanban
          </span>
          <input
            id="nav-board-btn"
            class="nav-btn"
            type="radio"
            name="nav"
            value="boards" checked />
          Boards
        </label>

        <label class="nav-items" for="nav-board-pages" tabindex="0">
          <span class="icon light material-symbols-outlined" aria-hidden="true">
            draft
          </span>
          <input
            id="nav-board-pages"
            class="nav-btn"
            type="radio"
            name="nav"
            value="pages" />
          Pages
        </label>

        <label class="nav-items" for="nav-board-settings" tabindex="0">
          <span class="icon light material-symbols-outlined" aria-hidden="true">
            settings
          </span>
          <input
            id="nav-board-settings"
            class="nav-btn"
            type="radio"
            name="nav"
            value="settings" />
          Settings
        </label>
      </div>
    </nav>

    <main id="body-container">
      <div id="board-head">
        <h2 class="board-title">Board Title</h2>
        <button class="icon-btn" type="button"
          aria-label="Add board to favorites">
          <span class="icon light material-symbols-outlined"
            aria-hidden="true">star</span>
        </button>
      </div>

      <div id="board-body">

        <section class="status-item" aria-labelledby="column-title-1">
          <div class="status-head">
            <h3 class="status-title" id="column-title-1">Column Title</h3>
            <div class="tasks-amount">3</div>
            <button class="icon-btn status-options" type="button"
              aria-label="Column Options">
              <span class="icon light material-symbols-outlined"
                aria-hidden="true">more_vert</span>
            </button>
          </div>

          <div class="task-container teste">

            
          </div>
        </section>

        <section class="empty-status-item" aria-labelledby="empty-column">

          <button id="add-section-btn" class="add-section" type="button"
            aria-label="Add column to the board">
            <span
              class="icon light material-symbols-outlined"
              aria-hidden="true"
              style="font-variation-settings:'wght' 500, 'GRAD' 100, 'opsz' 48">add</span>
          </button>

        </section>

      </div>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
